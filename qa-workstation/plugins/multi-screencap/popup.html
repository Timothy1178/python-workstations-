<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { width: 360px; margin: 0; font: 13px -apple-system, "Segoe UI", Roboto, sans-serif; color: #1f2937; }
header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #e5e7eb; }
header strong { font-size: 14px; }
.count { color: #6b7280; font-size: 12px; }
.actions { display: flex; gap: 6px; padding: 10px 12px; flex-wrap: wrap; }
button { border: 1px solid #d1d5db; background: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
button:hover { border-color: #2563eb; }
button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
button.danger { color: #dc2626; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 12px 12px; max-height: 380px; overflow-y: auto; }
.shot { border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
.shot img { width: 100%; height: 90px; object-fit: cover; display: block; cursor: zoom-in; }
.shot .bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; }
.shot .meta { font-size: 10px; color: #6b7280; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100px; }
.shot .bar button { padding: 2px 6px; font-size: 11px; }
.empty { padding: 24px 12px; color: #6b7280; text-align: center; }
footer { padding: 6px 12px 10px; color: #9ca3af; font-size: 11px; }
</style>
</head>
<body>
<header>
  <strong>📸 QA Multi Screen Cap</strong>
  <span class="count" id="count"></span>
</header>
<div class="actions">
  <button class="primary" id="cap-visible">📸 Visible page</button>
  <button class="primary" id="cap-area">✂️ Select area</button>
  <button id="save-all">💾 Save all</button>
  <button class="danger" id="clear-all">🗑 Clear</button>
</div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>No captures yet — take one above.<br>Shortcuts: Alt+Shift+F (page) · Alt+Shift+S (area)</div>
<footer>Captures stay in the browser until you clear them · QA Workstation plugin</footer>
<script src="popup.js"></script>
</body>
</html>
