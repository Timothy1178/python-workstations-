<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="gallery.css">
</head>
<body class="popup">
<header>
  <strong>📸 QA Multi Screen Cap</strong>
  <span class="count" id="count"></span>
</header>
<div class="actions">
  <button class="primary" id="cap-visible" title="Capture the visible page">📸 Page</button>
  <button class="primary" id="cap-area" title="Drag-select an area">✂️ Area</button>
  <button id="cap-last-area">↻ Saved area</button>
  <button id="open-panel" title="Open the floating capture window — stays open while you work">🗔 Panel</button>
  <button id="save-all" title="Save every capture to Downloads/screencaps/">💾 All</button>
  <button class="danger" id="clear-all" title="Clear the gallery">🗑</button>
  <button id="shortcuts" title="Change the keyboard shortcuts">⌨️</button>
  <select id="scale" title="Capture quality — 2× and 3× render the page at higher resolution (Chrome shows a short 'debugging' bar while capturing)">
    <option value="1">🔍 Auto</option>
    <option value="2">🔍 2× HD</option>
    <option value="3">🔍 3× Ultra</option>
  </select>
</div>
<div class="ws-status" id="ws-status">🧪 Connecting to the workstation…</div>
<div class="actions">
  <button class="primary" id="send-all" disabled title="Upload every capture in the gallery to the workstation's current test case">📤 Send all to case</button>
  <button id="settings-btn" title="Workstation settings">⚙️</button>
</div>
<div class="settings-row" id="settings-row" hidden>
  <label>Workstation URL <input id="ws-url" type="url" placeholder="http://127.0.0.1:5010"></label>
  <label class="check"><input id="ws-clear" type="checkbox"> clear gallery after sending</label>
</div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>No captures yet — take one above.<br>Alt+Shift+F page · Alt+Shift+S area · Alt+Shift+A saved area<br>(change them with ⌨️)</div>
<div class="tip">🗔 opens a small window that stays open — drag thumbnails from it into Excel or the workstation, or 📋 copy &amp; paste.</div>
<script src="gallery.js"></script>
</body>
</html>
