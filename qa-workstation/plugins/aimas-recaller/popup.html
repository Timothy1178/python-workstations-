<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"></head>
<body class="popup">
<header><strong>📝 AIMAS Recaller</strong><span class="muted" id="page"></span></header>
<div class="actions">
  <button class="primary" id="snapshot" title="Capture every filled field on this page now (Alt+Shift+R)">📥 Snapshot form</button>
  <button id="record" title="Watch the form as you fill it and capture the fields in order">⏺ Record</button>
  <label class="check" title="Password fields are skipped unless ticked — recipes are stored unencrypted in this browser"><input type="checkbox" id="pw"> passwords</label>
</div>
<div class="status" id="status">Fill in a form, then snapshot it — or record while you fill.</div>
<div class="section" id="here-title">Recipes for this page</div>
<div class="list" id="here"></div>
<div class="section">All recipes</div>
<div class="list" id="all"></div>
<div class="actions">
  <button id="export" title="Download all recipes as JSON">⬇ Export</button>
  <button id="import" title="Import recipes from a JSON file">⬆ Import</button>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <span class="muted">Alt+Shift+P replays the last recipe used on this page</span>
</div>
<script src="popup.js"></script>
</body></html>
